<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>선진</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="stamp-rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 1.8" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- ================= 배경화면 ================= -->
  <div id="desktop">
    <div id="icon-row" class="icon-row">
      <button id="mail-icon" class="app-icon">
        <span class="ascii-icon">@</span>
        <span>mail</span>
      </button>

      <button id="notes-icon" class="app-icon">
        <span class="ascii-icon">#</span>
        <span>memo</span>
      </button>

      <button id="me-icon" class="app-icon">
        <span class="ascii-icon">?</span>
        <span>me</span>
      </button>

      <button id="memory-icon" class="app-icon">
        <span class="ascii-icon">&amp;</span>
        <span>memory</span>
      </button>

      <button id="music-icon" class="app-icon" type="button">
        <span class="ascii-icon">&gt;</span>
        <span>music</span>
      </button>

      <button id="m-icon" class="app-icon" type="button">
        <span class="ascii-icon">!</span>
        <span>mmm...</span>
      </button>
    </div>
    <div id="yt-player-container" class="yt-player-hidden"></div>
  </div>

  <!-- ================= 메모 앱 윈도우 ================= -->
  <div id="notes-window" class="app-window" role="dialog" aria-label="메모">
    <div class="titlebar">
      <div class="traffic-lights">
        <button class="tl-btn tl-close" aria-label="닫기"></button>
        <button class="tl-btn tl-min" aria-label="최소화"></button>
        <button class="tl-btn tl-zoom" aria-label="전체화면"></button>
      </div>
      <div class="titlebar-label">메모</div>
    </div>

    <div class="app-body">
      <!-- ---- 폴더 ---- -->
      <nav id="folders-pane">
        <div class="folders-header">전체</div>
        <ul id="folders-list"></ul>
      </nav>

      <!-- ---- 메모 목록 ---- -->
      <aside id="list-pane">
        <header class="list-header">
          <h1 id="list-title">모든 메모</h1>
          <p id="list-subtitle"></p>
        </header>

        <div class="search-bar">
          <svg viewBox="0 0 24 24" class="icon-search"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.3" y1="15.3" x2="20" y2="20"/></svg>
          <input type="text" id="search-input" placeholder="검색" />
        </div>

        <ul id="notes-list"></ul>
      </aside>

      <!-- ---- 메모 상세 ---- -->
      <main id="detail-pane">
        <header class="detail-header">
          <button id="back-btn">
            <svg viewBox="0 0 24 24" class="icon-chevron"><path d="M15.5 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            메모
          </button>
          <button id="share-btn" aria-label="공유">
            <svg viewBox="0 0 24 24" class="icon-share"><path d="M12 3v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
        </header>

        <div class="detail-body">
          <h2 id="detail-title"></h2>
          <div id="detail-content"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- ================= 메일 앱 윈도우 ================= -->
  <div id="mail-window" class="app-window" role="dialog" aria-label="메일">
    <div class="titlebar">
      <div class="traffic-lights">
        <button class="tl-btn tl-close" aria-label="닫기"></button>
        <button class="tl-btn tl-min" aria-label="최소화"></button>
        <button class="tl-btn tl-zoom" aria-label="전체화면"></button>
      </div>
      <div class="titlebar-label">메일</div>
    </div>

    <div class="app-body">
      <!-- ---- 메일 폴더 ---- -->
      <nav class="mail-folders">
        <button type="button" id="compose-btn" class="compose-btn">
          <svg viewBox="0 0 24 24" class="icon-compose"><path d="M3 6.5A1.5 1.5 0 014.5 5h15A1.5 1.5 0 0121 6.5v11a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 17.5v-11z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 6.5l8 6.5 8-6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          메일쓰기
        </button>
        <ul id="mail-folders-list"></ul>
      </nav>

      <!-- ---- 메일 목록 / 상세 (네이버 메일처럼 목록이 상세로 전환) ---- -->
      <section class="mail-main">
        <header class="mail-list-header" id="mail-list-header">
          <h1 id="mail-list-title">받은메일함</h1>
          <div class="search-bar">
            <svg viewBox="0 0 24 24" class="icon-search"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.3" y1="15.3" x2="20" y2="20"/></svg>
            <input type="text" id="mail-search-input" placeholder="메일 검색" />
          </div>
        </header>

        <ul id="mail-list"></ul>

        <div id="mail-detail-pane">
          <header class="mail-detail-header">
            <button id="mail-back-btn">
              <svg viewBox="0 0 24 24" class="icon-chevron"><path d="M15.5 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              목록
            </button>
            <button id="mail-star-btn" aria-label="중요 표시">
              <svg viewBox="0 0 24 24" class="icon-star"><path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z"/></svg>
            </button>
          </header>
          <div class="mail-detail-body">
            <h2 id="mail-detail-subject"></h2>
            <div class="mail-meta">
              <span id="mail-detail-sender"></span>
              <span id="mail-detail-date"></span>
            </div>
            <div id="mail-detail-content"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- ================= me 앱 윈도우 ================= -->
  <div id="me-window" class="app-window" role="dialog" aria-label="me">
    <div class="titlebar">
      <div class="traffic-lights">
        <button class="tl-btn tl-close" aria-label="닫기"></button>
        <button class="tl-btn tl-min" aria-label="최소화"></button>
        <button class="tl-btn tl-zoom" aria-label="전체화면"></button>
      </div>
      <div class="titlebar-label">me</div>
    </div>

    <div class="app-body">
      <div class="profile-body">
        <div class="stamp-stack" id="stamp-stack"></div>

      </div>
    </div>
  </div>

  <!-- ================= memory 앱 윈도우 ================= -->
  <div id="memory-window" class="app-window" role="dialog" aria-label="memory">
    <div class="titlebar">
      <div class="traffic-lights">
        <button class="tl-btn tl-close" aria-label="닫기"></button>
        <button class="tl-btn tl-min" aria-label="최소화"></button>
        <button class="tl-btn tl-zoom" aria-label="전체화면"></button>
      </div>
      <div class="titlebar-label">memory</div>
    </div>

    <div class="app-body">
      <div class="memory-body">
        <div id="memory-grid" class="memory-grid"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- ================= 컨택트 모달 ================= -->
  <div id="contact-overlay" class="contact-overlay">
    <div class="contact-modal contact-modal-simple">
      <header class="contact-modal-header">
        <h2>Email</h2>
        <button type="button" id="contact-close" class="contact-close" aria-label="닫기">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="contact-email-body">
        <p class="contact-email-address">apome@naver.com</p>
        <button type="button" id="contact-copy" class="contact-btn contact-btn-send">복사</button>
      </div>
    </div>
  </div>

  <!-- ================= 이미지 라이트박스 ================= -->
  <div id="image-lightbox" class="image-lightbox">
    <button type="button" id="lightbox-close" class="lightbox-close" aria-label="닫기">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <img id="lightbox-img" alt="" />
  </div>

  <script src="script.js"></script>
</body>
</html>
